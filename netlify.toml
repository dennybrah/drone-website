# Netlify Configuration File
# Las Vegas Logic Media

[build]
  # Publish directory (root since this is a static HTML site)
  publish = "."

  # Functions directory for serverless functions
  functions = ".netlify/functions"

# Redirect rules
[[redirects]]
  from = "/booking"
  to = "/booking.html"
  status = 200

[[redirects]]
  from = "/confirmation"
  to = "/confirmation.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/portfolio.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/real-estate-photography-las-vegas"
  to = "/real-estate-photography-las-vegas.html"
  status = 200

[[redirects]]
  from = "/commercial-real-estate-photography-las-vegas"
  to = "/commercial-real-estate-photography-las-vegas.html"
  status = 200

[[redirects]]
  from = "/business-video-las-vegas"
  to = "/business-video-las-vegas.html"
  status = 200

[[redirects]]
  from = "/drone-photography-las-vegas"
  to = "/drone-photography-las-vegas.html"
  status = 200

[[redirects]]
  from = "/construction-progress-drone-services-las-vegas"
  to = "/construction-progress-drone-services-las-vegas.html"
  status = 200

[[redirects]]
  from = "/raw-drone-footage-las-vegas"
  to = "/raw-drone-footage-las-vegas.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Form handling
[forms]
  # Enable Netlify Forms for invoice requests

# Environment variables (configure these in Netlify Dashboard)
# Required environment variables:
# - STRIPE_SECRET_KEY (your Stripe secret key - sk_test_... or sk_live_...)
# - URL (your site URL - https://www.lvlogicmedia.com)

# Functions configuration
[functions]
  # Set Node.js version for functions
  node_bundler = "esbuild"
